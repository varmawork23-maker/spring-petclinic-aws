version: 0.2

phases:
  install:
    commands:
      - echo "Java version:"
      - java -version

  pre_build:
    commands:
      - echo "Preparing Maven Wrapper"
      - chmod +x mvnw

  build:
    commands:
      - echo "Building Spring Boot application"
      - ./mvnw clean package -DskipTests

  post_build:
    commands:
      - echo "Build completed successfully"

artifacts:
  files:
    - target/*.jar
    - Procfile